name: V2.5B diagnostic unit

on:
  push:
    paths:
      - "scripts/diagnose_v25b_raw_unit.py"
      - ".github/workflows/v25b_diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .
      - name: Run raw evaluator diagnostic for failing unit
        shell: pwsh
        run: python scripts/diagnose_v25b_raw_unit.py
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25b-diagnostic-${{ github.run_id }}
          if-no-files-found: error
          path: reports/v25b_diagnostic_ieee13_1900_31_inc.json
