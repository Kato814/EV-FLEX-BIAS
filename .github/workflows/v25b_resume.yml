name: V2.5B-R2 resume from checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  resume:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout frozen R2 experiment commit
        uses: actions/checkout@v4
        with:
          ref: 2ba97a7f62d2dcfeb711971fc589441f00f5016a
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .
          python -m pip install pytest==8.4.2

      - name: Download R2 checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: ev-flex-bias-v25-results-31574804939
          path: _resume_artifact
          github-token: ${{ github.token }}
          repository: Kato814/EV-FLEX-BIAS
          run-id: 31574804939

      - name: Restore and verify checkpoint
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force state/runtime/transferability_replication_v2_5b | Out-Null
          Copy-Item _resume_artifact/state/runtime/transferability_replication_v2_5b/checkpoint.json `
            state/runtime/transferability_replication_v2_5b/checkpoint.json
          python -c "import json; p=r'state/runtime/transferability_replication_v2_5b/checkpoint.json'; d=json.load(open(p,encoding='utf-8')); assert d['code_commit']=='2ba97a7f62d2dcfeb711971fc589441f00f5016a'; assert len(d['unit_results'])==93; print('Checkpoint OK: 93/96 units complete')"
          Remove-Item -Recurse -Force _resume_artifact
          $dirty = git status --porcelain
          if ($dirty) { Write-Error "Worktree is dirty before resume:`n$dirty"; exit 1 }

      - name: Verify R2-specific tests
        shell: pwsh
        run: python -m pytest -q tests/test_transferability_replication_v2_5b.py

      - name: Resume remaining three-phase work units
        shell: pwsh
        run: python -m evflex.transferability_replication_v2_5b --workers 1 --all --resume

      - name: Independently recompute V2.5A robustness summary
        shell: pwsh
        run: python scripts/analyze_phicte_robustness_v2_5a.py --overwrite

      - name: Independently verify completed V2.5B-R2 outputs
        shell: pwsh
        run: python scripts/verify_transferability_replication_v2_5b.py

      - name: Upload completed R2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev-flex-bias-v25-r2-complete-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            results/transferability_replication_v2_5b/summary.json
            results/transferability_replication_v2_5b/predictions.csv
            results/transferability_phicte_v2_5a_robustness/summary.json
            reports/v2_5b_independent_verification.json
            reports/v2_5b_r1_preexecution_audit.md
            reports/v2_5b_r2_execution_amendment.md
            state/runtime/transferability_replication_v2_5b/checkpoint.json
