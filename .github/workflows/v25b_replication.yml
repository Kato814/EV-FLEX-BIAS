name: V2.5B-R2 transferability and repair replication

on:
  push:
    paths:
      - "config/transferability_replication_v2_5b.json"
      - "src/evflex/transferability_replication_v2_5b.py"
      - "scripts/run_transferability_replication_v2_5b.py"
      - "scripts/analyze_phicte_robustness_v2_5a.py"
      - "scripts/verify_transferability_replication_v2_5b.py"
      - "reports/v2_5b_r1_preexecution_audit.md"
      - "reports/v2_5b_r2_execution_amendment.md"
      - "tests/test_transferability_replication_v2_5b.py"
      - ".github/workflows/v25b_replication.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v25b-replication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replicate:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout frozen experiment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .
          python -m pip install pytest==8.4.2

      - name: Verify V2.5B-R2 design
        shell: pwsh
        run: python -m pytest -q tests/test_transferability_replication_v2_5b.py

      - name: Full regression suite
        shell: pwsh
        run: python -m pytest -q -p no:faulthandler

      - name: Confirm clean pre-run worktree
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) { Write-Error "Worktree is dirty before V2.5B-R2:`n$dirty"; exit 1 }

      - name: Run expanded retrospective three-phase replication
        shell: pwsh
        run: python -m evflex.transferability_replication_v2_5b --workers 1 --all

      - name: Independently recompute V2.5A robustness summary
        shell: pwsh
        run: python scripts/analyze_phicte_robustness_v2_5a.py --overwrite

      - name: Independently verify V2.5B-R2 outputs
        shell: pwsh
        run: python scripts/verify_transferability_replication_v2_5b.py

      - name: Upload experiment artifacts before commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ev-flex-bias-v25-results-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            results/transferability_replication_v2_5b/summary.json
            results/transferability_replication_v2_5b/predictions.csv
            results/transferability_phicte_v2_5a_robustness/summary.json
            reports/v2_5b_independent_verification.json
            reports/v2_5b_r1_preexecution_audit.md
            reports/v2_5b_r2_execution_amendment.md
            state/runtime/transferability_replication_v2_5b/checkpoint.json

      - name: Commit completed experiment artifacts
        if: success()
        shell: pwsh
        run: |
          git config user.name "EV-FLEX-BIAS experiment bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/transferability_replication_v2_5b/summary.json `
                  results/transferability_replication_v2_5b/predictions.csv `
                  results/transferability_phicte_v2_5a_robustness/summary.json `
                  reports/v2_5b_independent_verification.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "results: archive V2.5B-R2 transferability replication"
            git push origin "HEAD:$env:GITHUB_REF_NAME"
          } else {
            Write-Host "No result changes to commit."
          }
