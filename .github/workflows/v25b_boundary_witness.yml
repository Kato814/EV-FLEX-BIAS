name: V2.5B-R2 boundary witness diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      R2_COMMIT: "2ba97a7f62d2dcfeb711971fc589441f00f5016a"
      R2_RUN_ID: "31671974049"

    steps:
      - name: Checkout diagnostic commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scientific inputs match frozen R2
        shell: pwsh
        run: |
          git diff --exit-code $env:R2_COMMIT -- src/evflex config data manifests legacy requirements.lock.txt pyproject.toml
          if ($LASTEXITCODE -ne 0) {
            throw "Scientific inputs differ from frozen R2 commit $env:R2_COMMIT"
          }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock.txt
          python -m pip install -e .

      - name: Download completed R2 result artifact
        uses: actions/download-artifact@v4
        with:
          name: ev-flex-bias-v25-r2-complete-31671974049
          path: _r2_complete
          github-token: ${{ github.token }}
          repository: Kato814/EV-FLEX-BIAS
          run-id: 31671974049

      - name: Verify completed R2 inputs
        shell: pwsh
        run: |
          python -c "import json,pandas as pd; s=json.load(open(r'_r2_complete/results/transferability_replication_v2_5b/summary.json',encoding='utf-8')); p=pd.read_csv(r'_r2_complete/results/transferability_replication_v2_5b/predictions.csv'); assert len(s['evaluations'])==288; assert len(p)==288; assert sum(1 for r in s['evaluations'] if r.get('duration_min')==15 and r.get('active_offer') is True and r.get('eligible_for_scientific_denominator') is True and isinstance(r.get('alpha_transfer'),(int,float)) and r['alpha_transfer']<1)==56; print('Completed R2 artifact OK: 288 evaluations, 56 limited primary cases')"

      - name: Run boundary-witness diagnostic
        shell: pwsh
        run: |
          python scripts/diagnose_v25b_boundary_witness.py `
            --summary _r2_complete/results/transferability_replication_v2_5b/summary.json `
            --predictions _r2_complete/results/transferability_replication_v2_5b/predictions.csv

      - name: Upload boundary-witness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25b-r2-boundary-witness-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            reports/v2_5b_boundary_witness.json
            reports/v2_5b_boundary_witness.csv
            reports/v2_5b_boundary_witness.md
